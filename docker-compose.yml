version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db_84
    restart: always
    ports:
    - "3309:3306"    # En MySQL 8.0+ a veces es mejor omitir el plugin nativo si usas clientes modernos,
    # pero lo dejo por compatibilidad con tu ejemplo.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: laravel_gsm
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data_84:/var/lib/mysql
    networks:
      - laravel_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_app_84
    restart: always
    ports:
      - "9084:80" # Puerto externo cambiado a 8084
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    networks:
      - laravel_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_84
    restart: always
    ports:
      - "9085:80" # Puerto externo cambiado a 8085
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
      UPLOAD_LIMIT: 256M
    depends_on:
      - db
    networks:
      - laravel_network

volumes:
  db_data_84: # Nombre de volumen único para no mezclar datos viejos

networks:
  laravel_network:
